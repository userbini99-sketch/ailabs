name: Deploy site to GitHub Pages

# Publishes the storefront to GitHub Pages on every push to the site branch.
# The site is plain HTML/CSS/JS, so there is nothing to build — the repo root
# is uploaded as-is.

on:
  push:
    branches:
      - claude/ai-product-seller-site-wtvke8
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Configure Pages
        # enablement: true switches Pages on the first time this runs, so no
        # manual toggle in repository settings is needed.
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
